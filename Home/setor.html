<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setor Popok - PuPoP</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #f7fafc;
      color: #2d3748;
      padding-bottom: 40px;
    }


    .header-wrapper {
      background: #2BB6C4;
      padding: 24px;
      border-radius: 0 0 40px 40px;
      box-shadow: 0 8px 25px rgba(0,0,0,.08);
    }

    .header-card {
      background: white;
      border-radius: 24px;
      height: 73px;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 30px;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #EAF9FA;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #2BB6C4;
      transition: background 0.2s;
    }

    .back-btn:hover {
      background-color: #d1f0f2;
    }

    .header-text h2 {
      color: #2BB6C4;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
    }

    .header-text p {
      color: #718096;
      font-size: 12px;
      font-weight: 400;
    }

    .content-container {
      max-width: 1000px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: start;
    }

    .card {
      background: #ffffff;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 20px;
    }

    .left-card {
      display: flex;
      flex-direction: column;
    }

    .display-box {
      background-color: #F4F5F7;
      border-radius: 12px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .big-number {
      font-size: 56px;
      font-weight: 700;
      color: #1a202c;
      line-height: 1;
      width: 160px;
      text-align: right;
      background: transparent;
      border: none;
      outline: none;
      font-family: inherit;
      padding: 0;
    }

    .big-number::placeholder {
      color: #CBD5E0;
    }

    .pcs-text {
      font-size: 14px;
      color: #A0AEC0;
      font-weight: 500;
      margin-top: 15px;
    }


    .stock-value {
      color: #2BB6C4;
      font-weight: 700;
    }

    .preset-buttons {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      margin-bottom: 24px;
    }

    .preset-btn {
      flex: 1;
      padding: 12px 0;
      border-radius: 8px;
      border: 1px solid transparent;
      background-color: #F4F5F7;
      color: #4A5568;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .preset-btn.active {
      background-color: #ffffff;
      border: 1px solid #2BB6C4;
      color: #2BB6C4;
    }

    .diaper-img-container {
      background-color: #F4F5F7;
      border-radius: 12px;
      height: 160px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .diaper-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      mix-blend-mode: multiply;
    }

    .right-col {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .location-header {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .loc-icon-wrapper {
      width: 45px;
      height: 45px;
      background-color: #EAF9FA;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #004D40;
      flex-shrink: 0;
    }

    .loc-info h3 {
      font-size: 16px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 4px;
    }

    .loc-info p {
      font-size: 13px;
      color: #718096;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .choose-loc-link {
      font-size: 12px;
      color: #2BB6C4;
      font-weight: 500;
      text-decoration: none;
    }

    .choose-loc-link:hover {
      text-decoration: underline;
    }

    .map-img-container {
      border-radius: 12px;
      overflow: hidden;
      height: 130px;
      background-color: #E2E8F0;
    }

    .map-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .detail-label {
      font-size: 14px;
      color: #4A5568;
    }

    .detail-value {
      font-size: 14px;
      color: #1a202c;
      font-weight: 500;
    }

    .total-row .detail-label {
      font-size: 16px;
      font-weight: 700;
      color: #1a202c;
    }

    .total-row .detail-value {
      font-size: 16px;
      font-weight: 700;
      color: #00796B;
    }

    .btn-submit {
      width: 100%;
      background-color: #38C6D5;
      color: white;
      border: none;
      padding: 16px 0;
      font-size: 15px;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background-color: #2bb6c4;
    }

    @media (max-width: 768px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
      .preset-buttons {
        flex-wrap: wrap;
      }
      .preset-btn {
        min-width: calc(50% - 6px);
      }
    }
  </style>
</head>
<body>

<div class="header-wrapper">
  <div class="header-card">
    <button class="back-btn" id="btnBack" aria-label="Kembali">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </button>
    <div class="header-text">
      <h2>Setor Popok</h2>
      <p>Setor popokmu disini untuk masa depan bumi yang lebih hijau.</p>
    </div>
  </div>
</div>

<div class="content-container">
  <div class="main-grid">

    <div class="card left-card">
      <h3 class="card-title">Masukan Jumlah Popok</h3>

      <div class="display-box">
        <input type="text" class="big-number" id="inputQty" value="5, 00" autocomplete="off" placeholder="0">
        <span class="pcs-text">Pcs</span>
      </div>

      <div class="preset-buttons">
        <button class="preset-btn active" data-val="5, 00">5, 00</button>
        <button class="preset-btn" data-val="15, 00">15, 00</button>
        <button class="preset-btn" data-val="25, 00">25, 00</button>
        <button class="preset-btn" data-val="30, 00">30, 00</button>
      </div>

      <div class="diaper-img-container">
        <img src="../Home/img/diaper.png" alt="Ilustrasi Popok" id="imgDiaper">
      </div>
    </div>

    <div class="right-col">

      <div class="card">
        <div class="location-header">
          <div class="loc-icon-wrapper">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
            </svg>
          </div>
          <div class="loc-info">
            <h3>Lokasi Mitra</h3>
            <p>Jl. In dulu aja, No. 69, Bekasi Utara</p>
            <a href="../Home/pilihmitra.html" class="choose-loc-link">Pilih Lokasi &rarr;</a>
          </div>
        </div>
        <div class="map-img-container">
          <img src="../Home/img/mapp.png" alt="Peta Lokasi" id="imgMap">
        </div>
      </div>

      <div class="card">
        <h3 class="card-title">Detail Setor</h3>

        <div class="detail-row">
          <span class="detail-label">Jumlah setor popok</span>
          <span class="detail-value" id="summaryQty">5, 00 Pcs</span>
        </div>

        <div class="detail-row total-row">
          <span class="detail-label">Total Setor Popok</span>
          <span class="detail-value" id="totalQty">5, 00 Pcs</span>
        </div>

        <button type="button" class="btn-submit" id="btnSetor">Setor Sekarang</button>
      </div>

    </div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const presetBtns = document.querySelectorAll('.preset-btn');
    const inputQty = document.getElementById('inputQty');
    const summaryQty = document.getElementById('summaryQty');
    const totalQty = document.getElementById('totalQty');
    const btnBack = document.getElementById('btnBack');
    const btnSetor = document.getElementById('btnSetor');

    function updateDetail(val) {
      const displayVal = val.trim() === "" ? "0" : val;
      summaryQty.textContent = displayVal + " Pcs";
      totalQty.textContent = displayVal + " Pcs";
    }

    inputQty.addEventListener('input', function() {
      const currentVal = this.value;
      updateDetail(currentVal);

      presetBtns.forEach(btn => {
        if (btn.getAttribute('data-val') === currentVal) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    });

    presetBtns.forEach(btn => {
      btn.addEventListener('click', function() {
        presetBtns.forEach(b => b.classList.remove('active'));
        this.classList.add('active');

        const val = this.getAttribute('data-val');
        inputQty.value = val;
        updateDetail(val);
      });
    });

    btnBack.addEventListener("click", function() {
      window.location.href = "../Home/home.html";
    });

    btnSetor.addEventListener("click", function() {

      window.location.href = "../Home/setor1.html";
    });
  });

  btnSetor.addEventListener("click", function() {

    sessionStorage.setItem('jumlahSetor', inputQty.value);

    window.location.href = "scan_qr.html";
  });
</script>
</body>
</html>
